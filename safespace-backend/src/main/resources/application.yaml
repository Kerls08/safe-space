spring:
  application:
    name: safe-space

  # ── Database (Cloud PostgreSQL / Local H2 Fallback) ──
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:mem:safespace}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 30000

  # ── JPA / Hibernate ──
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        "[format_sql]": true

  # ── H2 Console (accessible at /h2-console) ──
  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: false

  # ── File Upload (Multipart) ──
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

# ── Server ──
server:
  port: ${PORT:8080}

# ── Logging ──
logging:
  level:
    "[com.safe.space]": DEBUG
    "[org.springframework.web]": INFO
