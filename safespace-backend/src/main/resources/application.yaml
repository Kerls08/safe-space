spring:
  application:
    name: safe-space

  # ── Database (Cloud PostgreSQL / Local H2 Fallback) ──
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:mem:safespace}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 30000

  # ── JPA / Hibernate ──
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        "[format_sql]": true

  # ── H2 Console (accessible at /h2-console) ──
  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: false

  # ── File Upload (Multipart) ──
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  # ── Email Configuration (Brevo SMTP) ──
  mail:
    host: ${SPRING_MAIL_HOST:smtp-relay.brevo.com}
    port: ${SPRING_MAIL_PORT:587}
    username: ${SPRING_MAIL_USERNAME:}
    password: ${SPRING_MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

# ── SafeSpace Custom Application Configuration ──
safespace:
  mail:
    from-address: ${MAIL_FROM_ADDRESS:acoymo.kerlsan08@gmail.com}
    from-name: ${MAIL_FROM_NAME:SafeSpace System}
    app-url: ${APP_URL:http://localhost:5173}
    enabled: ${MAIL_ENABLED:true}

# ── Server ──
server:
  port: ${PORT:8080}

# ── Logging ──
logging:
  level:
    "[com.safe.space]": DEBUG
    "[org.springframework.web]": INFO
