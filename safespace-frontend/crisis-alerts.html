<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Safe Space — Crisis Alerts</title>
  <meta name="description" content="Real-time crisis monitoring and alert management for campus professionals.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/alerts.css">
</head>
<body>
  <script src="js/auth-guard.js" data-page="crisis-alerts" data-allowed-roles="PROFESSIONAL,SUPER_ADMIN,ADMIN"></script>
  <nav class="navbar" id="navbar"></nav>

  <div class="alerts-layout">
    <!-- Header -->
    <header class="alerts-header" id="alertsHeader">
      <div class="alerts-header-inner">
        <div class="alerts-header-left">
          <div class="alerts-header-icon"><i class="fas fa-bell"></i></div>
          <div>
            <h1>Crisis Alerts</h1>
            <p>Real-time crisis monitoring &amp; response management</p>
          </div>
        </div>
        <div class="stats-chips" id="statsChips">
          <div class="stat-chip"><span class="stat-num" id="statNeedsAction">—</span>Needs Action</div>
          <div class="stat-chip"><span class="stat-num" id="statInProgress">—</span>In Progress</div>
          <div class="stat-chip"><span class="stat-num" id="statCritical">—</span>Critical Today</div>
        </div>
      </div>
    </header>

    <!-- Tabs (Option B: Direct & Simple) -->
    <div class="alerts-tabs" id="alertTabs">
      <button class="alert-tab active" data-tab="needsAction" id="tabNeedsAction">
        <i class="fas fa-bell"></i> Needs Action
        <span class="tab-count" id="needsActionCount" style="display:none;">0</span>
      </button>
      <button class="alert-tab" data-tab="inProgress" id="tabInProgress">
        <i class="fas fa-spinner"></i> In Progress
        <span class="tab-count" id="inProgressCount" style="display:none;">0</span>
      </button>
      <button class="alert-tab" data-tab="history" id="tabHistory">
        <i class="fas fa-archive"></i> Resolved History
      </button>
    </div>

    <!-- Content -->
    <div class="alerts-content">
      <!-- Needs Action Panel -->
      <div class="alert-panel active" id="panelNeedsAction">
        <div class="severity-filters" id="sevFilters">
          <button class="sev-pill active" data-sev="ALL">All</button>
          <button class="sev-pill" data-sev="CRITICAL">🔴 Critical</button>
          <button class="sev-pill" data-sev="HIGH">🟠 High</button>
          <button class="sev-pill" data-sev="MODERATE">🟡 Moderate</button>
          <button class="sev-pill" data-sev="LOW">🟢 Low</button>
        </div>
        <div id="needsActionContainer"></div>
      </div>

      <!-- In Progress Panel -->
      <div class="alert-panel" id="panelInProgress">
        <div class="severity-filters" id="inProgressFilters">
          <button class="sev-pill active" data-progress="ALL">All In Progress <span class="pill-count" id="countProgAll">0</span></button>
          <button class="sev-pill pill-declined" data-progress="DECLINED">⚠️ Outreach Declined <span class="pill-count" id="countProgDeclined">0</span></button>
          <button class="sev-pill pill-active-chat" data-progress="ACTIVE">💬 Active In-Session <span class="pill-count" id="countProgActive">0</span></button>
          <button class="sev-pill pill-invited" data-progress="INVITED">⏳ Invite Pending <span class="pill-count" id="countProgInvited">0</span></button>
        </div>
        <div id="inProgressContainer"></div>
      </div>

      <!-- Resolved History Panel -->
      <div class="alert-panel" id="panelHistory">
        <div class="severity-filters" id="historyFilters">
          <button class="sev-pill active" data-status="ALL">All</button>
          <button class="sev-pill" data-status="RESOLVED">✅ Resolved</button>
          <button class="sev-pill" data-status="ESCALATED">⬆ Escalated</button>
        </div>
        <div id="historyContainer"></div>
      </div>
    </div>
  </div>

  <!-- Resolution Modal -->
  <div class="modal-backdrop" id="resolveModal">
    <div class="modal-box">
      <h3 id="modalTitle">Resolve Alert</h3>
      <p style="font-size:0.78rem;color:#6b7280;margin-bottom:0.75rem;" id="modalDesc">
        Add notes about how this alert was handled.
      </p>
      <textarea id="modalNotes" placeholder="Resolution notes (optional)..."></textarea>
      <div class="modal-btns">
        <button class="cancel" onclick="closeModal()">Cancel</button>
        <button class="confirm" id="modalConfirm">Confirm</button>
      </div>
    </div>
  </div>

  <!-- Conflict / In-Progress Notice Modal -->
  <div class="modal-backdrop" id="conflictModal">
    <div class="modal-box" style="max-width:440px;">
      <div style="width:48px;height:48px;border-radius:50%;background:#fef3c7;color:#d97706;display:flex;align-items:center;justify-content:center;font-size:1.4rem;margin:0 auto 0.75rem;">
        <i class="fas fa-user-lock"></i>
      </div>
      <h3 id="conflictModalTitle" style="text-align:center;font-size:1.1rem;color:#1e293b;margin-bottom:0.5rem;">Session In Progress</h3>
      <div style="font-size:0.85rem;color:#475569;line-height:1.5;text-align:center;margin-bottom:1.25rem;" id="conflictModalMessage">
        Notice text
      </div>
      <div class="modal-btns" style="justify-content:center;">
        <button class="confirm" style="background:#4f46e5;width:100%;" onclick="closeConflictModal()">I Understand</button>
      </div>
    </div>
  </div>

  <script>
    const API_BASE = window.SAFE_SPACE_API_URL || (window.location.protocol === 'file:' || window.location.origin.includes('localhost') || window.location.origin.includes('127.0.0.1') ? 'http://localhost:8080/api' : 'https://safespace-backend-ws0m.onrender.com/api');
    const API = API_BASE + '/alerts';
    let currentSevFilter = 'ALL';
    let currentHistoryFilter = 'ALL';
    let pendingAction = null;

    // ── Init ──
    document.addEventListener('DOMContentLoaded', () => {
      // Tabs
      document.querySelectorAll('.alert-tab').forEach(tab => {
        tab.addEventListener('click', () => switchTab(tab.dataset.tab));
      });

      // Severity filters (Needs Action)
      document.querySelectorAll('#sevFilters .sev-pill').forEach(pill => {
        pill.addEventListener('click', () => {
          document.querySelectorAll('#sevFilters .sev-pill').forEach(p => p.classList.remove('active'));
          pill.classList.add('active');
          currentSevFilter = pill.dataset.sev;
          renderNeedsActionAlerts();
        });
      });

      // Casework stage filters (In Progress)
      document.querySelectorAll('#inProgressFilters .sev-pill').forEach(pill => {
        pill.addEventListener('click', () => {
          document.querySelectorAll('#inProgressFilters .sev-pill').forEach(p => p.classList.remove('active'));
          pill.classList.add('active');
          currentProgressFilter = pill.dataset.progress;
          renderInProgressAlerts();
        });
      });

      // History filters
      document.querySelectorAll('#historyFilters .sev-pill').forEach(pill => {
        pill.addEventListener('click', () => {
          document.querySelectorAll('#historyFilters .sev-pill').forEach(p => p.classList.remove('active'));
          pill.classList.add('active');
          currentHistoryFilter = pill.dataset.status;
          loadHistory();
        });
      });

      loadColleagueDirectory();
      loadStats();
      loadNeedsActionAlerts();

      // Auto-refresh every 15 seconds (silent background refresh)
      setInterval(() => {
        loadStats(true);
        const activePanel = document.querySelector('.alert-panel.active');
        if (activePanel && activePanel.id === 'panelNeedsAction') loadNeedsActionAlerts(true);
        if (activePanel && activePanel.id === 'panelInProgress') loadInProgressAlerts(true);
      }, 15000);
    });

    // ── Tab Switching (Option B: Direct & Simple) ──
    function switchTab(tabId) {
      document.querySelectorAll('.alert-tab').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.alert-panel').forEach(p => p.classList.remove('active'));
      document.querySelector(`[data-tab="${tabId}"]`).classList.add('active');
      const panelMap = { needsAction: 'panelNeedsAction', inProgress: 'panelInProgress', history: 'panelHistory' };
      const targetPanel = document.getElementById(panelMap[tabId]);
      if (targetPanel) targetPanel.classList.add('active');

      if (tabId === 'needsAction') loadNeedsActionAlerts();
      if (tabId === 'inProgress') loadInProgressAlerts();
      if (tabId === 'history') loadHistory();
    }

    // ── Load Stats ──
    let cachedNeedsActionAlerts = [];
    async function loadStats(silent = false) {
      try {
        const res = await SafeSpaceAuth.authFetch(`${API}/stats`, { silent });
        const s = await res.json();
        const needsActionNum = s.active || 0;
        const inProgressNum = (s.inProgress !== undefined ? s.inProgress : s.acknowledged) || 0;

        const statNeedsAction = document.getElementById('statNeedsAction');
        if (statNeedsAction) statNeedsAction.textContent = needsActionNum;

        const statInProgress = document.getElementById('statInProgress');
        if (statInProgress) statInProgress.textContent = inProgressNum;

        const statCritical = document.getElementById('statCritical');
        if (statCritical) statCritical.textContent = s.todayCritical || 0;

        const needsActionBadge = document.getElementById('needsActionCount');
        if (needsActionBadge) {
          needsActionBadge.textContent = needsActionNum;
          needsActionBadge.style.display = needsActionNum > 0 ? '' : 'none';
        }

        const inProgressBadge = document.getElementById('inProgressCount');
        if (inProgressBadge) {
          inProgressBadge.textContent = inProgressNum;
          inProgressBadge.style.display = inProgressNum > 0 ? '' : 'none';
        }
      } catch (e) { console.warn('Stats error:', e); }
    }

    // ── Helper: Effective Outreach Status ──
    function getEffectiveOutreachStatus(a) {
      if (a.outreachStatus && a.outreachStatus !== 'NONE') return a.outreachStatus;
      const notes = (a.resolutionNotes || '').toLowerCase();
      if (notes.includes('declined') || notes.includes('vent only')) return 'DECLINED';
      if (notes.includes('invite')) return 'INVITED';
      return 'NONE';
    }

    // ── Load Needs Action Alerts ──
    async function loadNeedsActionAlerts(silent = false) {
      try {
        const res = await SafeSpaceAuth.authFetch(API, { silent });
        cachedNeedsActionAlerts = await res.json();
        if (Array.isArray(cachedNeedsActionAlerts)) {
          // Pin CRITICAL alerts to the top, then sort by newest first
          const sevWeight = { CRITICAL: 4, HIGH: 3, MODERATE: 2, LOW: 1, INFO: 0 };
          cachedNeedsActionAlerts.sort((a, b) => {
            const wA = sevWeight[a.severity?.toUpperCase()] || 0;
            const wB = sevWeight[b.severity?.toUpperCase()] || 0;
            if (wA !== wB) return wB - wA; // Pin CRITICAL / HIGH acute signals first
            const tA = parseDateString(a.createdAt)?.getTime() || 0;
            const tB = parseDateString(b.createdAt)?.getTime() || 0;
            return tB - tA;
          });
        } else {
          cachedNeedsActionAlerts = [];
        }

        const badge = document.getElementById('needsActionCount');
        if (badge) {
          badge.textContent = cachedNeedsActionAlerts.length;
          badge.style.display = cachedNeedsActionAlerts.length > 0 ? '' : 'none';
        }

        renderNeedsActionAlerts();
      } catch (e) { console.warn('Needs Action error:', e); }
    }

    function renderNeedsActionAlerts() {
      const container = document.getElementById('needsActionContainer');
      if (!container) return;
      let filtered = cachedNeedsActionAlerts;
      if (currentSevFilter !== 'ALL') {
        filtered = filtered.filter(a => a.severity === currentSevFilter);
      }

      if (filtered.length === 0) {
        container.innerHTML = `<div class="alerts-empty"><i class="fas fa-check-circle" style="color:#10b981;"></i><p>${currentSevFilter !== 'ALL' ? 'No ' + currentSevFilter.toLowerCase() + ' alerts' : 'All clear — no incoming alerts needing action'}</p></div>`;
        return;
      }
      container.innerHTML = filtered.map(a => buildAlertCard(a, true)).join('');
    }

    // ── Load In Progress Alerts ──
    let cachedInProgressAlerts = [];
    let currentProgressFilter = 'ALL';

    async function loadInProgressAlerts(silent = false) {
      try {
        const res = await SafeSpaceAuth.authFetch(`${API}/in-progress`, { silent });
        const alerts = await res.json();
        if (Array.isArray(alerts)) {
          alerts.sort((a, b) => {
            const tA = parseDateString(a.createdAt)?.getTime() || 0;
            const tB = parseDateString(b.createdAt)?.getTime() || 0;
            return tB - tA;
          });
          cachedInProgressAlerts = alerts;
        } else {
          cachedInProgressAlerts = [];
        }

        const badge = document.getElementById('inProgressCount');
        if (badge) {
          badge.textContent = cachedInProgressAlerts.length;
          badge.style.display = cachedInProgressAlerts.length > 0 ? '' : 'none';
        }

        // Live casework pill counters
        const countAll = cachedInProgressAlerts.length;
        const countDeclined = cachedInProgressAlerts.filter(a => getEffectiveOutreachStatus(a) === 'DECLINED').length;
        const countActive = cachedInProgressAlerts.filter(a => getEffectiveOutreachStatus(a) === 'ACTIVE').length;
        const countInvited = cachedInProgressAlerts.filter(a => getEffectiveOutreachStatus(a) === 'INVITED').length;

        const elAll = document.getElementById('countProgAll');
        if (elAll) elAll.textContent = countAll;
        const elDec = document.getElementById('countProgDeclined');
        if (elDec) elDec.textContent = countDeclined;
        const elAct = document.getElementById('countProgActive');
        if (elAct) elAct.textContent = countActive;
        const elInv = document.getElementById('countProgInvited');
        if (elInv) elInv.textContent = countInvited;

        renderInProgressAlerts();
      } catch (e) { console.warn('In Progress error:', e); }
    }

    function renderInProgressAlerts() {
      const container = document.getElementById('inProgressContainer');
      if (!container) return;

      let filtered = cachedInProgressAlerts;
      if (currentProgressFilter !== 'ALL') {
        filtered = filtered.filter(a => getEffectiveOutreachStatus(a) === currentProgressFilter);
      }

      if (filtered.length === 0) {
        let msg = 'No alerts currently in progress';
        if (currentProgressFilter === 'DECLINED') msg = 'No outreach declined alerts';
        else if (currentProgressFilter === 'ACTIVE') msg = 'No active counseling sessions in progress';
        else if (currentProgressFilter === 'INVITED') msg = 'No pending outreach invitations';
        container.innerHTML = `<div class="alerts-empty"><i class="fas fa-check-double" style="color:#10b981;"></i><p>${msg}</p></div>`;
        return;
      }
      container.innerHTML = filtered.map(a => buildAlertCard(a, true)).join('');
    }

    // ── Load Resolved History ──
    async function loadHistory() {
      try {
        const statusParam = currentHistoryFilter !== 'ALL' ? `?status=${currentHistoryFilter}` : '';
        const res = await SafeSpaceAuth.authFetch(`${API}/history${statusParam}`);
        const alerts = await res.json();
        if (Array.isArray(alerts)) {
          alerts.sort((a, b) => {
            const tA = parseDateString(a.createdAt)?.getTime() || 0;
            const tB = parseDateString(b.createdAt)?.getTime() || 0;
            return tB - tA;
          });
        }
        const container = document.getElementById('historyContainer');
        if (!container) return;
        if (alerts.length === 0) {
          container.innerHTML = '<div class="alerts-empty"><i class="fas fa-archive" style="color:#6366f1;"></i><p>No alert history found</p></div>';
          return;
        }
        container.innerHTML = alerts.map(a => buildAlertCard(a, false)).join('');
      } catch (e) { console.warn('History error:', e); }
    }

    // Cache colleagues directory so all assigned professionals display by their real name & credentials
    const staffDirectory = {
      'psychologist': 'Dr. Clara Reyes, RPsy',
      'psychometrician': 'Lead Psychometrician, RPM',
      'maintenance': 'System Maintenance Engineer'
    };
    let colleagueDirectory = { ...staffDirectory };

    async function loadColleagueDirectory() {
      try {
        const res = await SafeSpaceAuth.authFetch(API_BASE + '/auth/colleagues');
        if (res.ok) {
          const list = await res.json();
          list.forEach(c => {
            if (c.username && c.fullName) {
              colleagueDirectory[c.username] = c.fullName;
            }
          });
        }
      } catch (e) { /* ignore */ }
    }

    function formatStaffName(username, fullName) {
      if (fullName && fullName.trim() && fullName !== username) {
        return fullName;
      }
      if (colleagueDirectory[username]) {
        return colleagueDirectory[username];
      }
      return username ? (username.charAt(0).toUpperCase() + username.slice(1)) : 'Assigned Clinician';
    }

    function renderOutreachStatusTag(a) {
      if (a.status === 'RESOLVED') {
        return '<span class="alert-tag status-resolved"><i class="fas fa-check"></i> RESOLVED</span>';
      }
      if (a.status === 'ESCALATED') {
        return '<span class="alert-tag status-escalated"><i class="fas fa-arrow-up"></i> ESCALATED</span>';
      }
      const outreachStatus = getEffectiveOutreachStatus(a);
      if (outreachStatus === 'DECLINED') {
        return '<span class="alert-tag status-declined"><i class="fas fa-hand-holding-heart"></i> ⚠️ Outreach Declined (Venting Only)</span>';
      }
      if (outreachStatus === 'INVITED') {
        return '<span class="alert-tag status-invited"><i class="fas fa-paper-plane"></i> ⏳ Outreach Sent (Awaiting Student)</span>';
      }
      if (outreachStatus === 'ACTIVE') {
        return '<span class="alert-tag status-chat-active"><i class="fas fa-comments"></i> 💬 In Active Counseling</span>';
      }
      if (outreachStatus === 'CONCLUDED') {
        return '<span class="alert-tag status-concluded"><i class="fas fa-check-circle"></i> ✓ Session Concluded</span>';
      }
      return `<span class="alert-tag status-${a.status?.toLowerCase()}">${a.status}</span>`;
    }

    // ── Alert Card ──
    function buildAlertCard(a, showActions) {
      const sevIcon = { CRITICAL: 'fa-skull-crossbones', HIGH: 'fa-triangle-exclamation', MODERATE: 'fa-exclamation', LOW: 'fa-info-circle', INFO: 'fa-info' };
      const typeLabels = {
        CRISIS_POST: 'Crisis Post', HIGH_ENERGY_POST: 'High Energy Post',
        CRISIS_CHAT: 'Crisis Chat', REPEAT_CRISIS: 'Repeat Crisis',
        ENERGY_SPIKE: 'Energy Spike', SYSTEM_EVENT: 'System Event'
      };
      const canAck = showActions && a.status === 'ACTIVE';
      const canResolve = showActions && (a.status === 'ACTIVE' || a.status === 'ACKNOWLEDGED');
      const outreachStatus = getEffectiveOutreachStatus(a);
      const isCritical = a.severity === 'CRITICAL';

      // Bottom Caseworker Assignment & Student Details Banner
      let bannerClass = 'unassigned';
      let assignmentText = '<span><i class="fas fa-triangle-exclamation"></i> <strong>Unassigned</strong> — Awaiting clinician response</span>';
      let timestampText = '';

      if (a.resolvedBy) {
        bannerClass = 'resolved';
        const staffName = formatStaffName(a.resolvedBy, a.resolvedByName);
        assignmentText = `<span><i class="fas fa-circle-check"></i> Resolved by: <strong>${escapeHtml(staffName)}</strong></span>`;
        if (a.resolvedAt) timestampText = `<i class="far fa-clock"></i> Resolved ${timeAgo(a.resolvedAt)}`;
      } else if (a.acknowledgedBy) {
        bannerClass = 'acknowledged';
        const staffName = formatStaffName(a.acknowledgedBy, a.acknowledgedByName);
        assignmentText = `<span><i class="fas fa-user-check"></i> Assigned &amp; Monitored by: <strong>${escapeHtml(staffName)}</strong></span>`;
        if (a.acknowledgedAt) timestampText = `<i class="far fa-clock"></i> Claimed ${timeAgo(a.acknowledgedAt)}`;
      }

      return `
        <div class="alert-card sev-${a.severity}">
          <div class="alert-sev-icon ${a.severity}">
            <i class="fas ${sevIcon[a.severity] || 'fa-bell'}"></i>
          </div>
          <div class="alert-body">
            <div class="alert-top">
              <div style="display:flex;align-items:center;gap:0.45rem;min-width:0;flex-wrap:wrap;">
                <div class="alert-title">${escapeHtml(a.title)}</div>
                ${isCritical ? '<span class="alert-critical-badge"><i class="fas fa-skull-crossbones"></i> CRITICAL — IMMEDIATE ACTION</span>' : ''}
              </div>
              <div class="alert-time">${timeAgo(a.createdAt)}</div>
            </div>

            <!-- Student Post / Message Excerpt -->
            ${a.message ? `
            <div class="alert-msg-box">
              <div class="alert-msg">"${escapeHtml(a.message)}"</div>
            </div>` : ''}

            <!-- Clinical Signals & Status Tags -->
            <div class="alert-meta">
              <span class="alert-tag type">${typeLabels[a.alertType] || a.alertType}</span>
              <span class="alert-tag sev-${a.severity?.toLowerCase()}">${a.severity}</span>
              ${a.emotionTag ? `<span class="alert-tag emotion">${getEmoji(a.emotionTag)} ${a.emotionTag}</span>` : ''}
              ${a.energyScore ? `<span class="alert-tag type">⚡ ${a.energyScore}/10 Energy</span>` : ''}
              ${renderOutreachStatusTag(a)}
            </div>

            ${outreachStatus === 'DECLINED' ? `
            <!-- Dedicated Outreach Declined Callout -->
            <div class="alert-declined-callout">
              <div class="declined-callout-icon"><i class="fas fa-hand-holding-heart"></i></div>
              <div class="declined-callout-text">
                <strong>Student declined counseling reach-out (prefers to vent only).</strong>
                <span>Clinical oversight: Student opted out of chat. Review this post to confirm it is safe to monitor, or escalate if acute danger is present.</span>
              </div>
            </div>` : ''}

            ${outreachStatus === 'ACTIVE' ? `
            <!-- Dedicated Active Counseling Callout -->
            <div class="alert-active-chat-callout">
              <div class="active-callout-icon"><i class="fas fa-comments"></i></div>
              <div class="active-callout-text">
                <strong>Student accepted outreach — Active counseling session in progress.</strong>
                <span>A clinician is currently connected in anonymous chat with this student.</span>
              </div>
            </div>` : ''}

            ${outreachStatus === 'INVITED' ? `
            <!-- Dedicated Outreach Pending Callout -->
            <div class="alert-invited-callout">
              <div class="invited-callout-icon"><i class="fas fa-paper-plane"></i></div>
              <div class="invited-callout-text">
                <strong>Outreach invitation sent — Awaiting student response.</strong>
                <span>An invitation check-in has been sent to the student. Waiting for student to accept or decline.</span>
              </div>
            </div>` : ''}

            <!-- Dedicated Bottom Report Details: Student + Assigned Clinician -->
            <div class="alert-assigned-banner ${bannerClass}">
              <div class="assigned-lead">
                <span class="alert-tag student-tag"><i class="fas fa-user-shield"></i> Student: <strong>${escapeHtml(a.pseudonym || 'Anonymous')}</strong></span>
                ${assignmentText}
              </div>
              ${timestampText ? `<div class="assigned-time">${timestampText}</div>` : ''}
            </div>

            <!-- Resolution Notes (if any) -->
            ${a.resolutionNotes ? `
            <div class="alert-notes-box">
              <i class="fas fa-clipboard-check"></i>
              <div class="notes-content">
                <span class="notes-label">Resolution Notes:</span>
                ${escapeHtml(a.resolutionNotes)}
              </div>
            </div>` : ''}
          </div>

          ${showActions ? `
          <div class="alert-actions">
            ${canAck ? `<button class="btn-alert ack" onclick="acknowledgeAlert('${a.alertId}')"><i class="fas fa-eye"></i> Ack</button>` : ''}
            ${outreachStatus === 'DECLINED' ? `
              <button class="btn-alert resolve" onclick="quickResolveDeclined('${a.alertId}')" title="Student chose to vent only. Close case safely as monitored."><i class="fas fa-check-double"></i> Mark Resolved (Monitored)</button>
              <button class="btn-alert resolve" onclick="openResolve('${a.alertId}','resolve')" title="Add custom notes"><i class="fas fa-clipboard"></i> Notes</button>
            ` : (outreachStatus === 'ACTIVE' || outreachStatus === 'INVITED') ? `
              <button class="btn-alert chat" onclick="window.location.href='anon-chat.html'"><i class="fas fa-comments"></i> ${outreachStatus === 'ACTIVE' ? 'Open Chat' : 'Monitor Session'}</button>
              ${canResolve ? `<button class="btn-alert resolve" onclick="openResolve('${a.alertId}','resolve')"><i class="fas fa-check"></i> Resolve</button>` : ''}
            ` : (canResolve ? `<button class="btn-alert resolve" onclick="openResolve('${a.alertId}','resolve')"><i class="fas fa-check"></i> Resolve</button>` : '')}
            ${canResolve ? `<button class="btn-alert escalate" onclick="openResolve('${a.alertId}','escalate')"><i class="fas fa-arrow-up"></i> Escalate</button>` : ''}
            ${(canResolve && a.pseudonym && outreachStatus !== 'DECLINED' && outreachStatus !== 'INVITED' && outreachStatus !== 'ACTIVE') ? `<button class="btn-alert chat" onclick="initiateChatFromAlert('${a.alertId}')"><i class="fas fa-hand-holding-heart"></i> Reach Out</button>` : ''}
          </div>` : ''}
        </div>
      `;
    }

    // ── Actions ──
    async function acknowledgeAlert(alertId) {
      try {
        await SafeSpaceAuth.authFetch(`${API}/${alertId}/acknowledge`, { method: 'PUT', body: '{}' });
        showToast('Alert acknowledged ✓');
        loadNeedsActionAlerts();
        loadInProgressAlerts();
        loadStats();
        SafeSpaceAuth.refreshBadges?.();
      } catch (e) { console.warn('Ack error:', e); }
    }

    async function quickResolveDeclined(alertId) {
      try {
        const res = await SafeSpaceAuth.authFetch(`${API}/${alertId}/quick-resolve-declined`, { method: 'PUT' });
        if (res.ok) {
          showToast('Marked as resolved (Monitored) ✓');
          loadNeedsActionAlerts();
          loadInProgressAlerts();
          loadStats();
          SafeSpaceAuth.refreshBadges?.();
        } else {
          showToast('Failed to resolve alert.');
        }
      } catch (e) {
        console.warn('Quick resolve error:', e);
        showToast('Error resolving alert.');
      }
    }

    function openResolve(alertId, action) {
      pendingAction = { alertId, action };
      const modal = document.getElementById('resolveModal');
      document.getElementById('modalTitle').textContent = action === 'resolve' ? 'Resolve Alert' : 'Escalate Alert';
      document.getElementById('modalDesc').textContent = action === 'resolve'
        ? 'Add notes about how this alert was handled.'
        : 'Provide reason for escalation to higher authority.';
      document.getElementById('modalNotes').value = '';
      document.getElementById('modalConfirm').textContent = action === 'resolve' ? 'Resolve' : 'Escalate';
      document.getElementById('modalConfirm').onclick = confirmAction;
      modal.classList.add('active');
    }

    function closeModal() {
      document.getElementById('resolveModal').classList.remove('active');
      pendingAction = null;
    }

    function showConflictModal(title, htmlMessage) {
      document.getElementById('conflictModalTitle').textContent = title;
      document.getElementById('conflictModalMessage').innerHTML = htmlMessage;
      document.getElementById('conflictModal').classList.add('active');
    }

    function closeConflictModal() {
      document.getElementById('conflictModal').classList.remove('active');
    }

    async function confirmAction() {
      if (!pendingAction) return;
      const notes = document.getElementById('modalNotes').value;
      const endpoint = `${API}/${pendingAction.alertId}/${pendingAction.action}`;
      try {
        await SafeSpaceAuth.authFetch(endpoint, { method: 'PUT', body: JSON.stringify({ notes }) });
        showToast(pendingAction.action === 'resolve' ? 'Alert resolved ✓' : 'Alert escalated ⬆');
        closeModal();
        loadNeedsActionAlerts();
        loadInProgressAlerts();
        loadStats();
        SafeSpaceAuth.refreshBadges?.();
      } catch (e) {
        showToast('Action failed. Try again.');
      }
    }

    // ── Initiate Chat / Outreach from Alert ──
    async function initiateChatFromAlert(alertId) {
      try {
        const fullName = SafeSpaceAuth.getFullName() || SafeSpaceAuth.getUsername() || 'Counselor';
        const res = await SafeSpaceAuth.authFetch(`${API}/${alertId}/chat`, {
          method: 'POST',
          body: JSON.stringify({ professionalName: fullName })
        });
        if (!res.ok) {
          const err = await res.json();
          showToast(err.error || 'Failed to reach out.');
          return;
        }
        const data = await res.json();

        if (data.status === 'already_active_with_other') {
          showConflictModal(
            'Active Counseling in Progress',
            `This student is currently in an active 1-on-1 counseling session with <strong>${escapeHtml(data.professionalName)}</strong>.<br><br>To protect student privacy and avoid conflicting guidance, only one professional can conduct a session at a time.`
          );
          return;
        }

        if (data.status === 'already_invited_by_other') {
          showConflictModal(
            'Outreach Invitation Pending',
            `An outreach invitation has already been sent to this student by <strong>${escapeHtml(data.professionalName)}</strong>.<br><br>We are currently awaiting the student's response.`
          );
          return;
        }

        if (data.status === 'invite_sent') {
          showToast('Outreach invitation sent to student ✓ (Waiting for student to accept)');
          loadNeedsActionAlerts();
          loadInProgressAlerts();
          loadStats();
          SafeSpaceAuth.refreshBadges?.();
          return;
        }

        if (data.status === 'claimed_waiting') {
          showToast('Connected to student\'s waiting chat session ✓ Redirecting...');
          setTimeout(() => {
            window.location.href = `anon-chat.html?session=${data.sessionId}`;
          }, 700);
          return;
        }

        if (data.status === 'resumed_active') {
          showToast('Resuming active counseling session ✓ Redirecting...');
          setTimeout(() => {
            window.location.href = `anon-chat.html?session=${data.sessionId}`;
          }, 700);
          return;
        }

        // Fallback / legacy status
        showToast('Connecting to chat session...');
        setTimeout(() => {
          window.location.href = `anon-chat.html?session=${data.sessionId}`;
        }, 700);
      } catch (e) {
        console.warn('Chat initiation error:', e);
        showToast('Failed to reach out. Try again.');
      }
    }

    // ── Helpers ──
    function escapeHtml(t) {
      if (!t) return '';
      const d = document.createElement('div'); d.textContent = t; return d.innerHTML;
    }
    function getEmoji(e) {
      const m = { Sad:'😢', Angry:'😤', Anxious:'😰', Lonely:'🥺', Frustrated:'😩', Neutral:'😐', Relieved:'😌', Happy:'😊' };
      return m[e] || '💭';
    }
    function parseDateString(ds) {
      if (!ds) return null;
      if (ds instanceof Date) return ds;
      let str = String(ds).trim();
      if (!str.endsWith('Z') && !str.includes('+') && !/[-+]\d{2}:\d{2}$/.test(str)) {
        str += 'Z';
      }
      const d = new Date(str);
      return isNaN(d.getTime()) ? new Date(ds) : d;
    }
    function timeAgo(ds) {
      if (!ds) return '';
      const d = parseDateString(ds);
      if (!d || isNaN(d.getTime())) return '';
      const n = new Date(), s = Math.floor((n - d) / 1000);
      if (s < 60) return 'just now';
      if (s < 3600) return Math.floor(s / 60) + 'm ago';
      if (s < 86400) return Math.floor(s / 3600) + 'h ago';
      return Math.floor(s / 86400) + 'd ago';
    }
    function showToast(msg) {
      const old = document.querySelector('.alert-toast'); if (old) old.remove();
      const t = document.createElement('div'); t.className = 'alert-toast'; t.textContent = msg;
      document.body.appendChild(t); setTimeout(() => t.remove(), 3000);
    }
  </script>
</body>
</html>
